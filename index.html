<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Seguimiento de producción · Lattice Works</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#121212" />
<!-- LA PANTALLA NEGRA (8-ago, la vio César con el link de Arzate): esta hoja
     de Google Fonts cargaba BLOQUEANDO el render. En el navegador embebido de
     WhatsApp con señal lenta, si fonts.googleapis.com tarda, la página entera
     se queda sin pintar — y en un teléfono en modo oscuro eso se ve NEGRO.
     media="print" + onload la vuelve no-bloqueante: la página pinta al
     instante con la fuente del sistema y la de marca entra cuando llega. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
  /* mismos tokens que el ERP (simulador-v3.css) — homogeneidad total de marca */
  :root { --bg:#121212; --card:#1B1B1B; --card2:#161616; --line:#2c2c2c; --gold:#BDA76C; --txt:#fff; --txt2:#CFCFCF; --txt4:#8f8f8f; --green:#4ade80;
    /* escala tipográfica de la casa: CINCO tamaños, piso 11px (el mismo piso
       que César confirmó para el ERP el 3-ago). Antes esta página tenía 13
       tamaños distintos y 6 bajo el piso — en el teléfono del cliente. */
    --t-micro:11px; --t-meta:12px; --t-cuerpo:13.5px; --t-sub:16px; --t-titulo:21px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--txt); font-family: 'Manrope', sans-serif; min-height: 100vh; }
  header { background: var(--card); border-bottom: 2px solid var(--gold); padding: 16px; text-align: center; }
  header img { height: 30px; display: block; margin: 0 auto; }
  header .lw { color: var(--gold); font-weight: 800; letter-spacing: .34em; font-size: 15px; }
  header .sub { color: var(--txt4); font-size: var(--t-micro); margin-top: 6px; letter-spacing: .18em; font-family: 'JetBrains Mono', monospace; }
  main { max-width: 480px; margin: 0 auto; padding: 22px 16px 30px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 14px; }
  .folio { font-family: 'JetBrains Mono', monospace; color: var(--gold); font-size: var(--t-meta); letter-spacing: .08em; }
  .nombre { font-size: var(--t-titulo); font-weight: 800; margin-top: 6px; }
  .empresa { color: var(--txt4); font-size: var(--t-meta); margin-top: 2px; }
  .estado { display: inline-flex; align-items: center; gap: 7px; margin-top: 14px; border: 1px solid var(--gold); color: var(--gold); border-radius: 8px; padding: 7px 14px; font-family: 'JetBrains Mono', monospace; font-size: var(--t-micro); letter-spacing: .1em; }
  .estado.done { border-color: var(--green); color: var(--green); }
  .center { text-align: center; }
  .prog { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 16px; }
  .prog .bar { height: 100%; background: var(--gold); border-radius: 4px; transition: width .4s ease; }
  .entrega { margin-top: 14px; font-size: var(--t-cuerpo); color: var(--txt2); }
  .entrega b { color: var(--txt); }
  .entrega .cd { display: inline-block; margin-left: 6px; font-family: 'JetBrains Mono', monospace; font-size: var(--t-micro); color: var(--gold); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
  .entrega .cd.hoy { color: var(--green); border-color: var(--green); }
  .sec { color: var(--gold); font-family: 'JetBrains Mono', monospace; font-size: var(--t-micro); letter-spacing: .16em; margin-bottom: 12px; }

  /* avances del taller (lo que publicamos para el cliente) — cada fila:
     palomita · texto · cámara si trae foto (11-ago, César) */
  .av { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .av:first-of-type { padding-top: 0; }
  .av:last-child { border-bottom: 0; padding-bottom: 0; }
  .av-chk { flex: none; width: 18px; height: 18px; border-radius: 50%; margin-top: 1px;
    background: rgba(74,222,128,.12); border: 1px solid rgba(74,222,128,.45); color: var(--green);
    font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .av.nuevo .av-chk, .av-chk.oro { background: rgba(189,167,108,.14); border-color: rgba(189,167,108,.55); color: var(--gold); }
  .av-cuerpo { flex: 1; min-width: 0; }
  .av-cam { flex: none; color: var(--gold); opacity: .75; margin-top: 2px; }
  .av .t { font-size: var(--t-cuerpo); color: var(--txt); line-height: 1.45; }
  .av .f { font-family: 'JetBrains Mono', monospace; font-size: var(--t-micro); color: var(--txt4); margin-top: 4px; }
  .av .av-img { width: 100%; border-radius: 9px; margin-top: 8px; display: block; border: 1px solid var(--line); }
  /* avances colapsables (11-ago): cabecera tocable + contador de novedades */
  .av-head { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .av-head .av-titulo { margin: 0; }
  .av-head .grow { flex: 1; }
  .av-n { font-family: 'JetBrains Mono', monospace; font-size: var(--t-micro); color: var(--txt4); border: 1px solid var(--line); border-radius: 20px; padding: 1px 8px; }
  .av-nuevo { font-family: 'JetBrains Mono', monospace; font-size: var(--t-micro); color: #17150F; background: var(--gold); border-radius: 20px; padding: 2px 9px; font-weight: 700; letter-spacing: .04em; }
  .av-chev { color: var(--gold); font-size: 12px; width: 14px; text-align: center; }
  .av-lista { margin-top: 14px; }
  .av-cerrado { margin-top: 12px; }
  /* el porqué del fallo, discreto: al cliente no le estorba y a nosotros
     nos convierte su captura de pantalla en un diagnóstico */
  .err-tec { display: inline-block; margin-top: 8px; font-family: 'JetBrains Mono', monospace;
    font-size: var(--t-micro); color: var(--txt4); }
  /* adelanto del último comentario en UNA línea: palomita + texto con "…" +
     cámara si trae foto; el llamado se alinea con el texto, no con la palomita */
  .av-prev { display: flex; align-items: center; gap: 10px; }
  .av-prev .av-chk { margin-top: 0; }
  .av-prev-t { flex: 1; min-width: 0; font-size: var(--t-cuerpo); color: var(--txt2); line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av-prev .av-cam { margin-top: 0; }
  .av-prev-cta { margin: 6px 0 0 28px; font-family: 'JetBrains Mono', monospace; font-size: var(--t-micro);
    color: var(--gold); letter-spacing: .04em; }

  /* piezas del pedido */
  .pz { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: var(--t-cuerpo); }
  .pz:last-of-type { border-bottom: 0; }
  .pz .d { color: var(--txt2); min-width: 0; display: flex; align-items: center; gap: 8px; }
  .pz .n { font-family: 'JetBrains Mono', monospace; color: var(--txt); white-space: nowrap; }
  /* pieza YA lista (el taller la marcó cortada en Producción) */
  .pz.lista .d { color: var(--txt); }
  .pz-lista { font-family: 'JetBrains Mono', monospace; font-size: var(--t-micro); color: var(--green);
    border: 1px solid rgba(74,222,128,.4); border-radius: 20px; padding: 1px 8px; letter-spacing: .04em; white-space: nowrap; }
  .pz-lista.parc { color: var(--gold); border-color: rgba(189,167,108,.45); }
  .pz-tot { display: flex; justify-content: space-between; padding-top: 9px; margin-top: 3px; border-top: 1px solid var(--line); font-size: var(--t-meta); color: var(--txt4); }
  .pz-tot b { color: var(--gold); font-family: 'JetBrains Mono', monospace; }
  .mat { margin-top: 9px; font-size: var(--t-meta); color: var(--txt4); }

  /* viaje del pedido con fechas */
  .pasos { display: flex; flex-direction: column; gap: 0; }
  .paso { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; position: relative; }
  .paso .pin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); flex: none; z-index: 1; display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--bg); }
  .paso.on .pin { background: var(--gold); border-color: var(--gold); }
  .paso.now .pin { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 0 4px rgba(189,167,108,.18); }
  .paso:not(:last-child)::after { content: ''; position: absolute; left: 7px; top: 27px; bottom: -9px; width: 2px; background: var(--line); }
  .paso.on:not(:last-child)::after { background: var(--gold); }
  .paso .pl { font-size: var(--t-cuerpo); color: var(--txt4); padding-top: 1px; flex: 1; }
  .paso.on .pl { color: var(--txt); }
  .paso.now .pl { color: var(--gold); font-weight: 700; }
  .paso .pf { font-family: 'JetBrains Mono', monospace; font-size: var(--t-micro); color: var(--txt4); padding-top: 3px; white-space: nowrap; }

  /* tus diseños — el dibujo real de lo que se está cortando (8-ago).
     El lienzo lleva una malla de puntos dorados MUY tenue: es la lámina
     perforada que fabricamos, en un solo color de marca (la textura que se
     exploró para la landing, aquí al mínimo — contexto, no adorno). */
  .dz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 10px; }
  .dz-grid.uno { grid-template-columns: 1fr; }
  .dz { background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
  .dz .lienzo { background: radial-gradient(rgba(189,167,108,.09) 1px, transparent 1.3px); background-size: 13px 13px; border-radius: 7px; padding: 6px; }
  .dz svg { width: 100%; height: 104px; display: block; }
  .dz-grid.uno .dz svg { height: 170px; }
  .dz .dzn { font-size: var(--t-meta); font-weight: 600; color: var(--txt2); margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dz .dzm { font-family: 'JetBrains Mono', monospace; font-size: var(--t-micro); color: var(--txt4); margin-top: 3px; display: flex; justify-content: space-between; gap: 8px; }
  .dz .dzm b { color: var(--gold); font-weight: 600; }
  /* diseño YA listo — borde verde + sello en el lienzo + etiqueta ✓ LISTA */
  .dz.ok { border-color: rgba(74,222,128,.45); }
  .dz .lienzo { position: relative; }
  .dz .lienzo-ok { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--green); color: #10251a; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .dz-lista { margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: var(--t-micro); font-weight: 700;
    color: var(--green); letter-spacing: .06em; }
  .dz-lista.parcial { color: var(--gold); font-weight: 600; }
  /* estado por medida: ✓ esa medida completa · 1/3 en camino */
  .dzv-ok { color: var(--green); font-weight: 700; font-size: var(--t-micro); }
  .dzv-parc { color: var(--gold); font-family: 'JetBrains Mono', monospace; font-size: var(--t-micro); }
  /* misma pieza en varias medidas: el dibujo UNA vez, las medidas en renglones */
  .dzv { display: flex; justify-content: space-between; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: var(--t-micro); color: var(--txt2); padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .dzv:last-child { border-bottom: 0; padding-bottom: 0; }
  .dzv b { color: var(--gold); font-weight: 600; }
  .dzvs { margin-top: 7px; border-top: 1px solid var(--line); padding-top: 3px; }
  /* La única excepción al piso de 11px de esta página, a pedido de César
     (13-ago): es una nota al pie —una aclaración sobre el dibujo, no el
     contenido del pedido— y en cursiva y más chica se lee como lo que es,
     sin competir con las medidas de arriba. Todo lo demás mantiene el piso. */
  .dz-nota { font-size: 10px; font-style: italic; color: var(--txt4); margin-top: 10px; line-height: 1.5; }
  /* carrusel (pedido de César 8-ago): un diseño a la vez con ASOMO del
     siguiente — el asomo ES el aviso de que hay más, igual que el tablero
     móvil de Producción. Scroll nativo con anclaje; sin autoplay: el cliente
     está corroborando sus piezas, no viendo pasar anuncios. */
  .dz-carrusel { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin: 0 -20px; padding: 2px 20px 4px; }
  .dz-carrusel::-webkit-scrollbar { display: none; }
  .dz-carrusel .dz { flex: 0 0 82%; scroll-snap-align: center; }
  .dz-carrusel .dz svg { height: 150px; }
  .dz-dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
  .dz-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--line); transition: background .2s, transform .2s; }
  .dz-dots span.on { background: var(--gold); transform: scale(1.3); }
  .pz-resto { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 4px; }

  .err { text-align: center; padding: 60px 20px; color: var(--txt4); font-size: var(--t-cuerpo); }
  .err h2 { color: var(--txt); font-size: var(--t-sub); margin-bottom: 8px; }
  .err .retry { margin-top: 16px; background: var(--gold); color: #17150F; border: 0; border-radius: 9px; padding: 10px 22px; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; }
  .live { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: var(--t-micro); color: var(--txt4); padding: 2px 0 10px; }
  .live .dot { color: var(--green); animation: lat 2.4s ease-in-out infinite; }
  @keyframes lat { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  footer { text-align: center; color: var(--txt4); font-size: var(--t-micro); padding: 14px 16px 22px; letter-spacing: .04em; }
  .skel { text-align: center; color: var(--txt4); padding: 60px 0; font-size: var(--t-meta); }
  /* avance de corte — venía con colores de TEMA CLARO (gris #6B6B6B y crema
     #FBF7EC) sobre las cards oscuras: la barra era casi invisible. Detectado
     en la auditoría tipográfica del 8-ago; tokens de la casa. */
  .corte-av { margin: 12px 0 4px; }
  .corte-av .ca-bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .corte-av .ca-bar > div { height: 100%; background: linear-gradient(90deg, #BDA76C, #D9C48E); border-radius: 999px; transition: width .5s ease; }
  .corte-av .ca-txt { font-size: var(--t-cuerpo); color: var(--txt2); margin-top: 7px; }
  .corte-av .ca-txt b { color: var(--gold); font-size: var(--t-sub); }
  .mat-nota { margin: 12px 0 2px; font-size: var(--t-cuerpo); line-height: 1.6; color: var(--txt2);
    background: rgba(189,167,108,.08); border: 1px solid rgba(189,167,108,.35); border-radius: 9px; padding: 10px 13px; }
</style>
</head>
<body>
<header><img src="assets/logo-lattice-topbar.png" alt="LATTICE WORKS" onerror="this.outerHTML='<div class=&quot;lw&quot;>LATTICE WORKS</div>'"><div class="sub">SEGUIMIENTO DE PRODUCCIÓN</div></header>
<main id="app"><div class="skel">Cargando tu pedido…</div></main>
<div class="live" id="live"></div>
<footer>ventas@latticeworks.mx · Tel: +52 81-3475-0104 · Monterrey, NL</footer>

<!-- ./rastreo-config.js, no erp/… : el sitio publico (rastreo.latticeworks.mx)
     NO publica el arbol del repo — tiene esta pagina como index.html y el
     config a un lado. Antes habia que corregir esta linea A MANO en cada
     despliegue, y es justo el paso que se olvida. Asi el archivo se copia
     verbatim. (Verificado contra produccion el 31-jul.) -->
<script src="./rastreo-config.js"></script>
<script>
/* Abrir la conexión al servidor de datos DESDE YA (13-ago). El fetch real
   ocurre unas líneas más abajo, pero antes hay que resolver el DNS, abrir el
   socket y negociar el TLS: en wifi son milisegundos, en datos móviles —con la
   radio despertando y 300-800 ms de ida y vuelta— eso solo puede costar
   segundos. Pidiéndolo aquí, el teléfono lo va haciendo mientras termina de
   leer la página, y cuando toca pedir los datos el camino ya está abierto.
   Sale del CONFIG, no clavado: si algún día cambia el proyecto, se mueve solo. */
try {
  if (typeof RASTREO_CFG !== 'undefined' && RASTREO_CFG.url) {
    var lk = document.createElement('link');
    lk.rel = 'preconnect'; lk.href = RASTREO_CFG.url; lk.crossOrigin = 'anonymous';
    document.head.appendChild(lk);
  }
} catch (e) { /* si no se puede, la página funciona igual — solo tarda un pelo más */ }
</script>
<script>
/* Página PÚBLICA (Rastreo 2.0): el cliente ve su pedido EN VIVO — estado,
   desglose de piezas y los avances que el taller publica desde Producción.
   Cero precios ni datos internos (regla de vista cliente). Datos vía RPC
   get_rastreo_ot (SECURITY DEFINER validado por token); se refresca solo
   cada 60 s y al volver a la pestaña. */
const PASOS = [
  /* ORDEN Y ANTICIPO van PRIMERO (13-ago, César): es lo que de verdad pasó
     antes que nada. No es un estado del taller sino un hecho ya ocurrido —
     si la orden existe, esto ya sucedió— así que se pinta siempre cumplido.
     Ojo con la tentación de subir 'pendiente' en su lugar: ese estado es
     MATERIAL EN COLA, que ocurre DESPUÉS del diseño, y el viaje retrocedería
     al pasar de una etapa a la otra. */
  { key: '__recibida', label: 'Orden y anticipo recibidos', hecho: true },
  /* DISEÑO (13-ago-2026): toda orden nace aquí. Para el cliente es la etapa
     donde su dibujo se ajusta y se aprueba — el sello de esa aprobación es lo
     que el taller necesita poder probar después. */
  { key: 'diseno', label: 'Diseño y medidas finales' },
  { key: 'pendiente', label: 'Preparando el material' },
  { key: 'en_proceso', label: 'En proceso de corte' },
  { key: 'pausada', label: 'En pausa' },
  { key: 'acabado', label: 'Doblez y pintura' },
  { key: 'terminada', label: 'Listo para entrega' },
  { key: 'entregada', label: 'Entregado' },
];
// la pausa no es un "paso" del viaje; doblez/pintura solo si el pedido lo lleva
const visibles = conAcabado => PASOS.filter(p => p.key !== 'pausada' && (p.key !== 'acabado' || conAcabado));

const $app = document.getElementById('app');
const $live = document.getElementById('live');
const err = (t, m) => { $app.innerHTML = `<div class="err"><h2>${t}</h2><p>${m}</p></div>`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtF = s => s ? new Date(s.length <= 10 ? s + 'T12:00:00' : s).toLocaleDateString('es-MX', { day: 'numeric', month: 'long' }) : null;
const fmtDH = s => new Date(s).toLocaleDateString('es-MX', { day: '2-digit', month: 'short' });
/* El RPC manda la LLAVE interna del material (inox316, placaGruesa…); al
   cliente se le habla con el nombre del documento. Mismo mapa que el ERP. */
const MAT_NOMBRE = { acero: 'Acero al carbón', inoxidable: 'Inoxidable T304', inox316: 'Inoxidable T316', placaGruesa: 'Placa de acero', aluminio: 'Aluminio 3003' };
const matBonito = s => String(s || '').split(' · ').map(t => t.replace(/^(\S+)/, k => MAT_NOMBRE[k] || k)).join(' · ');
/* cámara para los avances con foto — SVG en línea (un emoji se ve distinto en
   cada sistema; este hereda el color de la casa) */
const CAM_SVG = '<svg class="av-cam" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Con foto"><path d="M4 8.6h3.1l2.1-2.6h5.6l2.1 2.6H20a.9.9 0 0 1 .9.9v8.6a.9.9 0 0 1-.9.9H4a.9.9 0 0 1-.9-.9V9.5a.9.9 0 0 1 .9-.9z"/><circle cx="12" cy="13.4" r="3.1"/></svg>';

const token = new URLSearchParams(location.search).get('t');
const demo = new URLSearchParams(location.search).has('demo');

async function traer() {
  if (demo) {
    return { ot: { folio_ot: 'OT-LW-2026-0155', estado: 'en_proceso', fecha_compromiso: new Date(Date.now() + 2 * 864e5).toISOString().slice(0, 10), cliente: 'Kato Gutierrez', empresa: '', piezas: 28, material: 'acero C16', tiene_acabado: true, updated_at: new Date().toISOString(),
      notas: [ { t: 'Recibimos tu anticipo — tu material ya está apartado.', ts: new Date(Date.now() - 2 * 864e5).toISOString() }, { t: 'Tus piezas ya están en la mesa de corte, va quedando muy bien 🔥', ts: new Date(Date.now() - 36e5).toISOString() } ],
      piezas_lista: [ { d: 'Placa base 300×600 mm', n: 12 }, { d: 'Soporte en L cal. 16', n: 10 }, { d: 'Tapa perforada decorativa', n: 6 } ],
      piezas_listas: [ { k: 'Tapa perforada decorativa|6', n: 6 }, { k: 'Soporte en L cal. 16|10', n: 4 } ] },
      eventos: [ { de: 'pendiente', a: 'en_proceso', created_at: new Date(Date.now() - 36e5 * 5).toISOString() }, { de: null, a: 'pendiente', created_at: new Date(Date.now() - 864e5).toISOString() } ] };
  }
  return traerConPaciencia();
}

/* POR QUÉ HAY REINTENTOS (13-ago, César: "no carga cuando no estoy en wifi").
   Antes era UN intento de 12 s: si fallaba, el cliente veía el error y ya. En
   wifi casi nunca falla; en datos móviles sí — la radio tarda en despertar, la
   latencia sube, se pierden paquetes, y el primer apretón de manos con el
   servidor puede pasarse de 12 s sin que la red esté realmente caída.
   Ahora insiste tres veces con más paciencia cada vez y le dice al cliente que
   sigue intentando, en vez de rendirse a la primera. */
let ultimoFallo = '';   // qué pasó en el último intento — lo usa el mensaje

async function traerUnaVez(msEspera) {
  const corte = new AbortController();
  const t = setTimeout(() => corte.abort(), msEspera);
  try {
    const r = await fetch(RASTREO_CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/get_rastreo_ot', {
      method: 'POST',
      headers: { apikey: RASTREO_CFG.anonKey, Authorization: 'Bearer ' + RASTREO_CFG.anonKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: token }),
      signal: corte.signal,
      cache: 'no-store',
    });
    if (!r.ok) { ultimoFallo = 'el servidor respondió ' + r.status; return null; }
    ultimoFallo = '';
    return await r.json();
  } catch (e) {
    // AbortError = se acabó la paciencia; lo demás = la red ni contestó
    ultimoFallo = (e && e.name === 'AbortError') ? 'se agotó el tiempo de espera'
      : (navigator.onLine === false ? 'el teléfono está sin conexión' : 'no hubo respuesta de la red');
    return null;
  } finally { clearTimeout(t); }
}

async function traerConPaciencia(soloUno) {
  // El refresco de fondo (cada 60 s) NO insiste: ya hay algo pintado en
  // pantalla y encadenar esperas largas solo calienta la batería.
  const ESPERAS = soloUno ? [12000] : [12000, 18000, 24000];
  for (let i = 0; i < ESPERAS.length; i++) {
    const d = await traerUnaVez(ESPERAS[i]);
    if (d) return d;
    if (i < ESPERAS.length - 1) {
      // si YA hay una copia en pantalla, ese aviso no se pisa: el cliente
      // tiene que seguir sabiendo que lo que ve es la última copia buena
      if ($live) $live.innerHTML = (hayPintado ? 'mostrando la última copia · ' : '')
        + `<span class="dot" style="color:var(--gold)">●</span> la red va lenta · reintentando (${i + 2} de ${ESPERAS.length})…`;
      await new Promise(r => setTimeout(r, 800 * (i + 1)));
    }
  }
  return null;
}

/* Última copia buena POR TOKEN: si el enlace ya abrió una vez en este
   teléfono, la siguiente vez pinta al instante — aunque la red esté floja —
   y el dato fresco entra en cuanto llega. */
const CACHE_KEY = 'rastreo.cache.' + token;
const cacheLeer = () => { try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) { return null; } };
const cacheGuardar = d => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) { /* modo privado: sin caché */ } };

/* El dibujo real de la pieza (viz compacto del ERP: contornos simplificados).
   DXF crece hacia arriba y SVG hacia abajo — de ahí el scale(1,-1). */
function vizSVG(viz) {
  if (!viz || !viz.bb || !Array.isArray(viz.c) || !viz.c.length) return '';
  const bb = viz.bb, w = bb.x1 - bb.x0, h = bb.y1 - bb.y0;
  if (!(w > 0) || !(h > 0)) return '';
  const m = Math.max(w, h) * 0.07, grosor = (Math.max(w, h) / 95).toFixed(2);
  const trazos = viz.c.map(k => {
    if (!Array.isArray(k.p) || k.p.length < 2) return '';
    const d = 'M' + k.p.map(pt => (+pt[0]).toFixed(1) + ' ' + (+pt[1]).toFixed(1)).join('L') + (k.z ? 'Z' : '');
    return `<path d="${d}" fill="none" stroke="${k.i ? 'rgba(189,167,108,.5)' : '#BDA76C'}" stroke-width="${grosor}" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join('');
  return `<svg viewBox="${(bb.x0 - m).toFixed(1)} ${(-bb.y1 - m).toFixed(1)} ${(w + 2 * m).toFixed(1)} ${(h + 2 * m).toFixed(1)}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Dibujo de la pieza"><g transform="scale(1,-1)">${trazos}</g></svg>`;
}

let avAbierto = null;   // null = automático · true/false = elección del cliente
function pintar(data, deCache) {
  const ot = data.ot, evs = data.eventos || [];
  const pausada = ot.estado === 'pausada';
  const VIS = visibles(!!ot.tiene_acabado);
  const idxViaje = VIS.findIndex(p => p.key === (pausada ? 'en_proceso' : ot.estado));
  const done = ot.estado === 'entregada';
  const compromiso = fmtF(ot.fecha_compromiso);
  // countdown de entrega (sin alarmas: si ya pasó, solo la fecha)
  let cd = '';
  if (ot.fecha_compromiso && !done) {
    const d = Math.round((new Date(ot.fecha_compromiso + 'T12:00:00') - new Date()) / 864e5);
    if (d === 0) cd = '<span class="cd hoy">HOY</span>';
    else if (d > 0) cd = `<span class="cd">en ${d} día${d !== 1 ? 's' : ''}</span>`;
  }
  // fecha en que se llegó a cada etapa (último evento que ENTRÓ a ella)
  const fechaEtapa = {};
  evs.slice().reverse().forEach(e => { fechaEtapa[e.a] = e.created_at; });
  // el paso de 'orden recibida' no tiene evento propio: su fecha es la del
  // nacimiento de la orden, que es el evento más viejo (evs viene DESC)
  if (evs.length) fechaEtapa.__recibida = evs[evs.length - 1].created_at;
  const notas = Array.isArray(ot.notas) ? ot.notas.slice().reverse() : [];
  // sin renglones ×0: una partida en cero no es una pieza que esperar
  const piezas = (Array.isArray(ot.piezas_lista) ? ot.piezas_lista : []).filter(p => p && +p.n > 0);

  // el refresco de 60 s re-pinta todo: si el cliente estaba viendo el tercer
  // diseño, se le respeta el lugar — que la página se actualice no significa
  // que le arrebate el carrusel de las manos
  const dzcAntes = document.getElementById('dzc');
  const dzcScroll = dzcAntes ? dzcAntes.scrollLeft : 0;

  $app.innerHTML = `
    <div class="card center">
      <div class="folio">${esc(ot.folio_ot)}</div>
      <div class="nombre">${esc(ot.cliente || '')}</div>
      ${ot.empresa ? `<div class="empresa">${esc(ot.empresa)}</div>` : ''}
      <div class="estado ${done ? 'done' : ''}">${done ? '✓' : '◷'} ${pausada ? 'EN PAUSA TEMPORAL' : (
        // En CORTE el estado dice el avance real, que es lo concreto. En las
        // demás etapas basta el nombre. (Idea de César 31-jul: "que el cliente
        // tenga una noción del porcentaje cortado y lo que falta".)
        (ot.estado === 'en_proceso' && ot.piezas > 0 && ot.piezas_cortadas > 0)
          ? `CORTANDO · ${ot.piezas_cortadas} DE ${ot.piezas} PIEZAS`
          : ot.estado === 'diseno' ? 'REVISANDO TU DISEÑO'
          : (ot.estado === 'pendiente' && !ot.material_ok)
            ? (ot.material_pedido ? 'PREPARANDO EL MATERIAL' : 'EN COLA DE PRODUCCIÓN')
            : (VIS[idxViaje] ? VIS[idxViaje].label.toUpperCase() : esc(ot.estado).toUpperCase()))}</div>
      ${(ot.estado === 'en_proceso' || ot.estado === 'pausada') && ot.piezas > 0 && ot.piezas_cortadas > 0 ? `
      <div class="corte-av">
        <div class="ca-bar"><div style="width:${Math.min(100, Math.round(ot.piezas_cortadas / ot.piezas * 100))}%"></div></div>
        <div class="ca-txt"><b>${ot.piezas_cortadas}</b> de ${ot.piezas} piezas cortadas · faltan ${Math.max(0, ot.piezas - ot.piezas_cortadas)}</div>
      </div>` : ''}
      ${ot.estado === 'diseno' ? `
      <div class="mat-nota">✎ Estamos afinando el diseño de tu pieza. En cuanto lo apruebes, pasa a corte.</div>` : ''}
      ${ot.estado === 'pendiente' && !ot.material_ok && ot.material_pedido ? `
      <div class="mat-nota">📦 Estamos esperando que llegue el material de tu pedido. En cuanto esté en piso arranca el corte.</div>` : ''}
      ${/* Dos barras apiladas confunden: la de piezas y la del viaje miden cosas
            distintas y el cliente no tiene cómo saberlo. Cuando hay avance de
            corte manda esa, que es la concreta; el viaje ya se ve completo en la
            línea de tiempo de abajo. */
        ((ot.estado === 'en_proceso' || ot.estado === 'pausada') && ot.piezas > 0 && ot.piezas_cortadas > 0)
          ? ''
          : `<div class="prog"><div class="bar" style="width:${((idxViaje + 1) / VIS.length * 100).toFixed(0)}%"></div></div>`}
      ${done ? '<div class="entrega"><b>Tu pedido fue entregado — gracias por confiar en Lattice Works.</b></div>'
        : compromiso ? `<div class="entrega">Entrega estimada: <b>${compromiso}</b>${cd}</div>` : ''}
    </div>

    ${(() => {
      if (!notas.length) return '';
      /* AVANCES COLAPSABLES (11-ago, César): cuando se juntan varios la página
         se hace larga. Se ocultan/muestran con un toque, y cuando está cerrada
         un contador dorado avisa si hay algo NUEVO desde la última vez que ESTE
         teléfono lo revisó (memoria por token en localStorage — cada cliente
         recuerda lo suyo). Al mostrarlos quedan "vistos": el badge se apaga la
         próxima vez, hasta que el taller publique otro. */
      const CLK = 'rastreo.av.' + (token || 'x');
      let visto = 0; try { visto = +localStorage.getItem(CLK) || 0; } catch (e) {}
      const tsDe = n => (n.ts ? new Date(n.ts).getTime() : 0);
      const nuevos = notas.filter(n => tsDe(n) > visto).length;
      const masNuevo = notas.reduce((mx, n) => Math.max(mx, tsDe(n)), 0);
      // por defecto CERRADO para que la página quede corta; el badge dorado
      // avisa si hay algo nuevo (César: "contador para cuando esté oculta").
      // Un único avance sí se muestra directo — no vale la pena ocultar uno.
      let abierto = (avAbierto === null) ? (notas.length === 1) : avAbierto;
      // "visto" solo si la pestaña se está VIENDO: el refresco de 60 s corre
      // también en background y marcaba leído lo que nadie había leído
      if (abierto) { avAbierto = true; if (masNuevo > visto && !document.hidden) { try { localStorage.setItem(CLK, String(masNuevo)); } catch (e) {} } }
      // adelanto del ÚLTIMO comentario cuando está cerrada (César 11-ago): en vez
      // de un genérico, se asoma el inicio de lo que el taller dejó; el CSS lo
      // corta con "…" al ancho de la columna (una sola línea).
      const ult = notas[0] || {};
      const adelanto = (ult.t || (ult.img ? 'Nueva foto de tu pedido' : 'Avance publicado')).trim();
      /* cada avance: palomita a la izquierda (dorada si es nuevo, verde si ya
         se vio), cuerpo al centro, y cámara a la DERECHA cuando trae foto
         (César 11-ago: "palomita tipo ✅ y símbolo de cámara del lado derecho") */
      const lista = notas.map(n => {
        const conFoto = n.img && /^https:\/\//.test(n.img);
        return `<div class="av ${tsDe(n) > visto ? 'nuevo' : ''}">
        <span class="av-chk">✓</span>
        <div class="av-cuerpo">
          <div class="t">${esc(n.t || (conFoto ? 'Así va tu pedido:' : ''))}</div>
          ${conFoto ? `<a href="${esc(n.img)}" target="_blank" rel="noopener"><img class="av-img" src="${esc(n.img)}" alt="Foto del avance de tu pedido" loading="lazy"></a>` : ''}
          <div class="f">${n.ts ? new Date(n.ts).toLocaleString('es-MX', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : ''}</div>
        </div>
        ${conFoto ? CAM_SVG : ''}
      </div>`;
      }).join('');
      return `<div class="card">
        <div class="av-head" id="av-toggle" role="button" tabindex="0" aria-expanded="${abierto}">
          <span class="sec av-titulo">AVANCES DEL TALLER</span><span class="grow"></span>
          ${(!abierto && nuevos > 0) ? `<span class="av-nuevo">${nuevos} nuevo${nuevos !== 1 ? 's' : ''}</span>` : `<span class="av-n">${notas.length}</span>`}
          <span class="av-chev">${abierto ? '▴' : '▾'}</span>
        </div>
        ${abierto ? `<div class="av-lista">${lista}</div>`
          : `<div class="av-cerrado">
              <div class="av-prev"><span class="av-chk ${nuevos > 0 ? 'oro' : ''}">✓</span><span class="av-prev-t">${esc(adelanto)}</span>${ult.img && /^https:\/\//.test(ult.img) ? CAM_SVG : ''}</div>
              <div class="av-prev-cta">Toca para ver ${notas.length === 1 ? 'el avance completo' : 'los ' + notas.length + ' avances'}${nuevos > 0 ? ' · hay novedades' : ''}</div>
            </div>`}
      </div>`;
    })()}

    ${(() => {
      /* TU PEDIDO (8-ago, 2ª iteración — la observación fue de César): antes
         eran DOS tarjetas — seis dibujos idénticos con su medida, y abajo una
         lista con el mismo nombre otras seis veces. El cliente corrobora LA
         FORMA una sola vez y LAS MEDIDAS una por una; obligarlo a lo contrario
         es ruido. Ahora es UNA tarjeta: cada forma se dibuja una vez (agrupada
         por su GEOMETRÍA, no por el nombre — dos diseños distintos que se
         llamen igual no se mezclan) y sus medidas van como renglones. Lo que
         no trae dibujo (captura a mano) sigue como renglón clásico. */
      // el bb es obligatorio: firma y medidas lo leen sin red — un viz a medias
      // (snapshot corrupto) no debe tumbar la página pública entera
      const dz = (Array.isArray(ot.disenos) ? ot.disenos : []).filter(x => x && x.viz && x.viz.c && x.viz.c.length && x.viz.bb && +x.n > 0);
      /* piezas ya cortadas: el taller lo captura en Producción por fila, con
         avance parcial. Formatos en piezas_listas: string 'desc|n' (v43.0 =
         fila completa) u objeto {k:'desc|AxB|n', n:cuántas} (v43.1, la llave
         lleva la MEDIDA para que dos variantes del mismo diseño no se
         confundan). `tomar` CONSUME del saldo — así dos variantes idénticas
         se reparten lo capturado en vez de palomearse las dos con una. */
      const saldo = new Map();
      (Array.isArray(ot.piezas_listas) ? ot.piezas_listas : []).forEach(e => {
        let k = null, n = 0;
        if (typeof e === 'string') { k = e; n = +e.slice(e.lastIndexOf('|') + 1) || 0; }
        else if (e && typeof e === 'object' && typeof e.k === 'string') { k = e.k; n = +e.n || 0; }
        if (k && n > 0) saldo.set(k, (saldo.get(k) || 0) + n);
      });
      const tomar = (claves, n) => {
        for (const k of claves) {
          const c = saldo.get(k) || 0;
          if (c > 0) { const t = Math.min(n, c); saldo.set(k, c - t); return t; }
        }
        return 0;
      };
      // desc en llave: MISMO default 'Pieza' que usa Producción al guardarla
      // (una desc vacía casaba 'Pieza|n' contra '|n' y el ✓ jamás llegaba), y
      // el separador | dentro de la desc se sanea igual en los dos lados
      const dK = d => String(d || 'Pieza').replace(/\|/g, '¦');
      const tomarResto = (d, n) => {
        // renglón sin dibujo: llave exacta 'desc|n' o, si el taller la marcó
        // con medida y aquí no la hay, cualquier llave desc|…|n del mismo par
        const t = tomar([dK(d) + '|' + (+n || 0)], +n || 0);
        if (t) return t;
        for (const [k, c] of saldo) {
          if (c > 0 && k.startsWith(dK(d) + '|') && k.endsWith('|' + (+n || 0))) {
            const q = Math.min(+n || 0, c); saldo.set(k, c - q); return q;
          }
        }
        return 0;
      };
      const firma = v => {
        const w = v.bb.x1 - v.bb.x0, h = v.bb.y1 - v.bb.y0;
        return (h > 0 ? (w / h).toFixed(1) : '?') + '|' + v.c.map(k => `${k.i}${k.z}:${(k.p || []).length}`).join(',');
      };
      const grupos = [];
      dz.forEach(x => {
        const f = firma(x.viz);
        let g = grupos.find(y => y.f === f);
        if (!g) { g = { f, nombre: x.d || 'Pieza', viz: x.viz, vars: [] }; grupos.push(g); }
        const bb = x.viz.bb, w = Math.round(bb.x1 - bb.x0), h = Math.round(bb.y1 - bb.y0);
        g.vars.push({ d: x.d || '', n: +x.n || 1, w, h, mm: `${w} × ${h} mm` });
      });
      // cuántas de cada variante están listas — en orden de pintado, para que
      // dos variantes idénticas se repartan el saldo y no se dupliquen los ✓
      grupos.forEach(g => g.vars.forEach(v => { v.cnt = tomar([`${dK(v.d)}|${v.w}×${v.h}|${v.n}`, `${dK(v.d)}|${v.n}`], v.n); }));
      // lo ya representado por un dibujo no se repite en la lista de abajo
      const resto = piezas.slice();
      grupos.forEach(g => g.vars.forEach(v => {
        const i = resto.findIndex(p => (p.d || '') === v.d && +p.n === +v.n);
        if (i >= 0) resto.splice(i, 1);
      }));
      if (!grupos.length && !resto.length) return '';
      // `s` = el servidor lo adelgazó para que viajara por datos móviles
      // (v45); `dib < n` = se dibujan menos contornos de los que tiene. Las dos
      // cosas se le dicen igual al cliente: lo que ve es una vista, no el corte.
      const algunaRecortada = dz.some(x => x.viz.s || (x.viz.dib && x.viz.n && x.viz.dib < x.viz.n));
      return `<div class="card">
        <div class="sec">TU PEDIDO${grupos.length ? ' · LO QUE ESTAMOS CORTANDO' : ''}</div>
        ${grupos.length ? `<div class="${grupos.length === 1 ? 'dz-grid uno' : 'dz-carrusel'}" ${grupos.length > 1 ? 'id="dzc" role="region" aria-label="Tus diseños"' : ''}>
          ${grupos.map(g => {
            const svg = vizSVG(g.viz); if (!svg) return '';
            const nTot = g.vars.reduce((s, v) => s + v.n, 0);
            const done = g.vars.reduce((s, v) => s + v.cnt, 0);
            const completo = g.vars.every(v => v.cnt >= v.n);
            const badge = !done ? ''
              : completo ? '<div class="dz-lista">✓ LISTA</div>'
              : `<div class="dz-lista parcial">✓ ${done} de ${nTot} piezas listas</div>`;
            // cada medida dice lo suyo: ✓ completa, 1/3 en camino, nada si no ha entrado
            const marca = v => v.cnt >= v.n ? '<span class="dzv-ok">✓</span>'
              : v.cnt > 0 ? `<span class="dzv-parc">${v.cnt}/${v.n}</span>` : '';
            return `<div class="dz ${completo ? 'ok' : ''}"><div class="lienzo">${svg}${completo ? '<span class="lienzo-ok">✓</span>' : ''}</div>
              <div class="dzn">${esc(g.nombre)}</div>
              ${badge}
              ${g.vars.length === 1
                ? `<div class="dzm"><span>${g.vars[0].mm}</span>${marca(g.vars[0])}<b>×${g.vars[0].n}</b></div>`
                : `<div class="dzm"><span>misma pieza · ${g.vars.length} medidas</span><b>×${nTot}</b></div>
                   <div class="dzvs">${g.vars.map(v => `<div class="dzv"><span>${v.mm}</span>${marca(v)}<b>×${v.n}</b></div>`).join('')}</div>`}
            </div>`;
          }).join('')}
        </div>${grupos.length > 1 ? `<div class="dz-dots" id="dzd">${grupos.map((_, i) => `<span class="${i === 0 ? 'on' : ''}"></span>`).join('')}</div>` : ''}` : ''}
        ${resto.length ? `<div class="${grupos.length ? 'pz-resto' : ''}">
          ${resto.map(p => {
            const cnt = tomarResto(p.d || '', +p.n || 0), ok = cnt >= (+p.n || 0) && cnt > 0;
            const chip = ok ? '<span class="pz-lista">✓ LISTA</span>' : cnt > 0 ? `<span class="pz-lista parc">✓ ${cnt} de ${+p.n || 0}</span>` : '';
            return `<div class="pz ${ok ? 'lista' : ''}"><span class="d">${esc(p.d || 'Pieza')}${chip}</span><span class="n">×${+p.n || 0}</span></div>`;
          }).join('')}
        </div>` : ''}
        <div class="pz-tot"><span>Total de piezas</span><b>${ot.piezas || piezas.reduce((s, p) => s + (+p.n || 0), 0)}</b></div>
        ${ot.material ? `<div class="mat">Material: ${esc(matBonito(ot.material))}</div>` : ''}
        ${algunaRecortada ? '<div class="dz-nota">Vista simplificada del dibujo — el corte usa el diseño completo, con todo su detalle.</div>' : ''}
      </div>`;
    })()}

    <div class="card">
      <div class="sec">EL VIAJE DE TU PEDIDO</div>
      <div class="pasos">
        ${VIS.map((p, i) => {
          // `hecho` = hito ya ocurrido por definición (la orden existe), no un
          // estado del taller: se pinta cumplido pase lo que pase
          const cumplido = p.hecho || i < idxViaje, ahora = i === idxViaje;
          return `<div class="paso ${cumplido ? 'on' : ''} ${ahora ? 'on now' : ''}">
          <span class="pin">${cumplido ? '✓' : ''}</span><span class="pl">${p.label}</span>
          ${(cumplido || ahora) && fechaEtapa[p.key] ? `<span class="pf">${fmtDH(fechaEtapa[p.key])}</span>` : ''}
        </div>`;
        }).join('')}
      </div>
    </div>
  `;
  const dzc = document.getElementById('dzc');
  if (dzc) {
    if (dzcScroll) dzc.scrollLeft = dzcScroll;
    const dots = [...document.querySelectorAll('#dzd span')];
    const marcar = () => {
      const ancho = dzc.firstElementChild ? dzc.firstElementChild.getBoundingClientRect().width + 10 : 1;
      const i = Math.min(dots.length - 1, Math.max(0, Math.round(dzc.scrollLeft / ancho)));
      dots.forEach((d, j) => d.classList.toggle('on', j === i));
    };
    dzc.addEventListener('scroll', () => requestAnimationFrame(marcar), { passive: true });
    marcar();
  }

  const avT = document.getElementById('av-toggle');
  if (avT) {
    // flip según lo que se ve ahora: si la lista está, ciérrala; si no, ábrela
    const flip = () => { avAbierto = !document.querySelector('.av-lista'); pintar(data, deCache); };
    avT.addEventListener('click', flip);
    avT.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  }

  $live.innerHTML = deCache
    ? '<span class="dot" style="color:var(--gold)">●</span> mostrando la última copia · buscando lo más reciente…'
    : `<span class="dot">●</span> EN VIVO · actualizado ${new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })} · se refresca solo`;
}

let hayPintado = false;
async function cargar(primera) {
  if (!demo && (!token || typeof RASTREO_CFG === 'undefined' || !RASTREO_CFG.url)) {
    return err('Esta orden no está disponible', 'El enlace no es válido o el seguimiento no está configurado. Contacta a Lattice Works.');
  }
  let data = null;
  // en la PRIMERA carga se insiste (datos móviles); en los refrescos de fondo
  // basta un intento: ya hay algo en pantalla
  try { data = demo ? await traer() : await traerConPaciencia(!primera); } catch (e) { data = null; }
  if (!data || !data.ot) {
    // Sin respuesta ≠ enlace muerto: puede ser la señal. Si hay copia local ya
    // pintada se queda; si no, se dice claro y se ofrece REINTENTAR — nunca
    // más una pantalla muda.
    if (primera && !hayPintado) {
      /* El motivo VA EN EL MENSAJE (13-ago): "no cargó" no dice nada ni al
         cliente ni a nosotros. Distinguir "sin conexión" de "se agotó el
         tiempo" o "el servidor respondió 500" es lo que convierte la captura
         de pantalla de un cliente en un diagnóstico. */
      const sinRed = navigator.onLine === false;
      err(sinRed ? 'Parece que no hay conexión' : 'No pudimos cargar tu pedido',
        (sinRed
          ? 'Tu teléfono no tiene internet en este momento. Conéctate y vuelve a intentar.'
          : 'Lo intentamos varias veces y la red no respondió. Si estás con datos móviles, prueba moverte a donde haya mejor señal.')
        + (ultimoFallo ? `<br><span class="err-tec">detalle: ${esc(ultimoFallo)}</span>` : ''));
      const b = document.createElement('button');
      b.className = 'retry'; b.textContent = 'Reintentar';
      b.addEventListener('click', () => { $app.innerHTML = '<div class="skel">Cargando tu pedido…</div>'; cargar(true); });
      $app.querySelector('.err').appendChild(b);
      // y si la conexión vuelve sola, se recarga sin que el cliente haga nada
      window.addEventListener('online', () => cargar(true), { once: true });
    }
    return; // en refrescos silenciosos no borramos lo que ya se ve
  }
  hayPintado = true;
  // pintar PRIMERO y cachear después: si un dato raro rompe el pintado, no
  // queda "envenenado" en el caché repitiendo el error en cada visita
  try { pintar(data); } catch (e) {
    hayPintado = false;
    if (primera) err('No pudimos mostrar tu pedido', 'Algo en los datos no se pudo dibujar. Contacta a Lattice Works.');
    return;
  }
  if (!demo) cacheGuardar(data);
}

// La última copia buena pinta AL INSTANTE (si existe); lo fresco la reemplaza.
const previa = demo ? null : cacheLeer();
if (previa && previa.ot) {
  // una copia que ya no pinta se descarta (no puede matar la página entera)
  try { pintar(previa, true); hayPintado = true; }
  catch (e) { try { localStorage.removeItem(CACHE_KEY); } catch (e2) {} }
}
cargar(true);
setInterval(() => cargar(false), 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) cargar(false); });
</script>
