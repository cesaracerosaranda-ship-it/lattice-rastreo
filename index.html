<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Seguimiento de producción · Lattice Works</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* mismos tokens que el ERP (simulador-v3.css) — homogeneidad total de marca */
  :root { --bg:#121212; --card:#1B1B1B; --card2:#161616; --line:#2c2c2c; --gold:#BDA76C; --txt:#fff; --txt2:#CFCFCF; --txt4:#8f8f8f; --green:#4ade80; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--txt); font-family: 'Manrope', sans-serif; min-height: 100vh; }
  header { background: var(--card); border-bottom: 2px solid var(--gold); padding: 16px; text-align: center; }
  header img { height: 30px; display: block; margin: 0 auto; }
  header .lw { color: var(--gold); font-weight: 800; letter-spacing: .34em; font-size: 15px; }
  header .sub { color: var(--txt4); font-size: 9.5px; margin-top: 6px; letter-spacing: .18em; font-family: 'JetBrains Mono', monospace; }
  main { max-width: 480px; margin: 0 auto; padding: 22px 16px 30px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 14px; }
  .folio { font-family: 'JetBrains Mono', monospace; color: var(--gold); font-size: 12px; letter-spacing: .08em; }
  .nombre { font-size: 20px; font-weight: 800; margin-top: 6px; }
  .empresa { color: var(--txt4); font-size: 12px; margin-top: 2px; }
  .estado { display: inline-flex; align-items: center; gap: 7px; margin-top: 14px; border: 1px solid var(--gold); color: var(--gold); border-radius: 8px; padding: 7px 14px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .1em; }
  .estado.done { border-color: var(--green); color: var(--green); }
  .center { text-align: center; }
  .prog { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 16px; }
  .prog .bar { height: 100%; background: var(--gold); border-radius: 4px; transition: width .4s ease; }
  .entrega { margin-top: 14px; font-size: 12.5px; color: var(--txt2); }
  .entrega b { color: var(--txt); }
  .entrega .cd { display: inline-block; margin-left: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--gold); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
  .entrega .cd.hoy { color: var(--green); border-color: var(--green); }
  .sec { color: var(--gold); font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .16em; margin-bottom: 12px; }

  /* avances del taller (lo que publicamos para el cliente) */
  .av { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .av:first-of-type { padding-top: 0; }
  .av:last-child { border-bottom: 0; padding-bottom: 0; }
  .av .t { font-size: 13px; color: var(--txt); line-height: 1.45; }
  .av .f { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--txt4); margin-top: 4px; }
  .av.nuevo .t::before { content: '●'; color: var(--gold); font-size: 8px; margin-right: 7px; vertical-align: 2px; }

  /* piezas del pedido */
  .pz { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 12.5px; }
  .pz:last-of-type { border-bottom: 0; }
  .pz .d { color: var(--txt2); min-width: 0; }
  .pz .n { font-family: 'JetBrains Mono', monospace; color: var(--txt); white-space: nowrap; }
  .pz-tot { display: flex; justify-content: space-between; padding-top: 9px; margin-top: 3px; border-top: 1px solid var(--line); font-size: 12px; color: var(--txt4); }
  .pz-tot b { color: var(--gold); font-family: 'JetBrains Mono', monospace; }
  .mat { margin-top: 9px; font-size: 11px; color: var(--txt4); }

  /* viaje del pedido con fechas */
  .pasos { display: flex; flex-direction: column; gap: 0; }
  .paso { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; position: relative; }
  .paso .pin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); flex: none; z-index: 1; display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--bg); }
  .paso.on .pin { background: var(--gold); border-color: var(--gold); }
  .paso.now .pin { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 0 4px rgba(189,167,108,.18); }
  .paso:not(:last-child)::after { content: ''; position: absolute; left: 7px; top: 27px; bottom: -9px; width: 2px; background: var(--line); }
  .paso.on:not(:last-child)::after { background: var(--gold); }
  .paso .pl { font-size: 12.5px; color: var(--txt4); padding-top: 1px; flex: 1; }
  .paso.on .pl { color: var(--txt); }
  .paso.now .pl { color: var(--gold); font-weight: 700; }
  .paso .pf { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--txt4); padding-top: 3px; white-space: nowrap; }

  .err { text-align: center; padding: 60px 20px; color: var(--txt4); }
  .err h2 { color: var(--txt); font-size: 16px; margin-bottom: 8px; }
  .live { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--txt4); padding: 2px 0 10px; }
  .live .dot { color: var(--green); animation: lat 2.4s ease-in-out infinite; }
  @keyframes lat { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  footer { text-align: center; color: var(--txt4); font-size: 9px; padding: 14px 16px 22px; letter-spacing: .04em; }
  .skel { text-align: center; color: var(--txt4); padding: 60px 0; font-size: 12px; }
</style>
</head>
<body>
<header><img src="assets/logo-lattice-topbar.png" alt="LATTICE WORKS" onerror="this.outerHTML='<div class=&quot;lw&quot;>LATTICE WORKS</div>'"><div class="sub">SEGUIMIENTO DE PRODUCCIÓN</div></header>
<main id="app"><div class="skel">Cargando tu pedido…</div></main>
<div class="live" id="live"></div>
<footer>ventas@latticeworks.mx · Tel: +52 81-3475-0104 · Monterrey, NL</footer>

<script src="./rastreo-config.js"></script>
<script>
/* Página PÚBLICA (Rastreo 2.0): el cliente ve su pedido EN VIVO — estado,
   desglose de piezas y los avances que el taller publica desde Producción.
   Cero precios ni datos internos (regla de vista cliente). Datos vía RPC
   get_rastreo_ot (SECURITY DEFINER validado por token); se refresca solo
   cada 60 s y al volver a la pestaña. */
const PASOS = [
  { key: 'pendiente', label: 'Orden recibida' },
  { key: 'en_proceso', label: 'En proceso de corte' },
  { key: 'pausada', label: 'En pausa' },
  { key: 'terminada', label: 'Corte terminado' },
  { key: 'acabado', label: 'Doblez y pintura' },
  { key: 'entregada', label: 'Entregado' },
];
// la pausa no es un "paso" del viaje; doblez/pintura solo si el pedido lo lleva
const visibles = conAcabado => PASOS.filter(p => p.key !== 'pausada' && (p.key !== 'acabado' || conAcabado));

const $app = document.getElementById('app');
const $live = document.getElementById('live');
const err = (t, m) => { $app.innerHTML = `<div class="err"><h2>${t}</h2><p>${m}</p></div>`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtF = s => s ? new Date(s.length <= 10 ? s + 'T12:00:00' : s).toLocaleDateString('es-MX', { day: 'numeric', month: 'long' }) : null;
const fmtDH = s => new Date(s).toLocaleDateString('es-MX', { day: '2-digit', month: 'short' });

const token = new URLSearchParams(location.search).get('t');
const demo = new URLSearchParams(location.search).has('demo');

async function traer() {
  if (demo) {
    return { ot: { folio_ot: 'OT-LW-2026-0155', estado: 'en_proceso', fecha_compromiso: new Date(Date.now() + 2 * 864e5).toISOString().slice(0, 10), cliente: 'Kato Gutierrez', empresa: '', piezas: 28, material: 'acero C16', tiene_acabado: true, updated_at: new Date().toISOString(),
      notas: [ { t: 'Recibimos tu anticipo — tu material ya está apartado.', ts: new Date(Date.now() - 2 * 864e5).toISOString() }, { t: 'Tus piezas ya están en la mesa de corte, va quedando muy bien 🔥', ts: new Date(Date.now() - 36e5).toISOString() } ],
      piezas_lista: [ { d: 'Placa base 300×600 mm', n: 12 }, { d: 'Soporte en L cal. 16', n: 10 }, { d: 'Tapa perforada decorativa', n: 6 } ] },
      eventos: [ { de: 'pendiente', a: 'en_proceso', created_at: new Date(Date.now() - 36e5 * 5).toISOString() }, { de: null, a: 'pendiente', created_at: new Date(Date.now() - 864e5).toISOString() } ] };
  }
  const r = await fetch(RASTREO_CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/get_rastreo_ot', {
    method: 'POST',
    headers: { apikey: RASTREO_CFG.anonKey, Authorization: 'Bearer ' + RASTREO_CFG.anonKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_token: token }),
  });
  return r.ok ? await r.json() : null;
}

function pintar(data) {
  const ot = data.ot, evs = data.eventos || [];
  const pausada = ot.estado === 'pausada';
  const VIS = visibles(!!ot.tiene_acabado);
  const idxViaje = VIS.findIndex(p => p.key === (pausada ? 'en_proceso' : ot.estado));
  const done = ot.estado === 'entregada';
  const compromiso = fmtF(ot.fecha_compromiso);
  // countdown de entrega (sin alarmas: si ya pasó, solo la fecha)
  let cd = '';
  if (ot.fecha_compromiso && !done) {
    const d = Math.round((new Date(ot.fecha_compromiso + 'T12:00:00') - new Date()) / 864e5);
    if (d === 0) cd = '<span class="cd hoy">HOY</span>';
    else if (d > 0) cd = `<span class="cd">en ${d} día${d !== 1 ? 's' : ''}</span>`;
  }
  // fecha en que se llegó a cada etapa (último evento que ENTRÓ a ella)
  const fechaEtapa = {};
  evs.slice().reverse().forEach(e => { fechaEtapa[e.a] = e.created_at; });
  const notas = Array.isArray(ot.notas) ? ot.notas.slice().reverse() : [];
  const piezas = Array.isArray(ot.piezas_lista) ? ot.piezas_lista : [];

  $app.innerHTML = `
    <div class="card center">
      <div class="folio">${esc(ot.folio_ot)}</div>
      <div class="nombre">${esc(ot.cliente || '')}</div>
      ${ot.empresa ? `<div class="empresa">${esc(ot.empresa)}</div>` : ''}
      <div class="estado ${done ? 'done' : ''}">${done ? '✓' : '◷'} ${pausada ? 'EN PAUSA TEMPORAL' : (VIS[idxViaje] ? VIS[idxViaje].label.toUpperCase() : esc(ot.estado).toUpperCase())}</div>
      <div class="prog"><div class="bar" style="width:${((idxViaje + 1) / VIS.length * 100).toFixed(0)}%"></div></div>
      ${done ? '<div class="entrega"><b>Tu pedido fue entregado — gracias por confiar en Lattice Works.</b></div>'
        : compromiso ? `<div class="entrega">Entrega estimada: <b>${compromiso}</b>${cd}</div>` : ''}
    </div>

    ${notas.length ? `<div class="card">
      <div class="sec">AVANCES DEL TALLER</div>
      ${notas.map((n, i) => `<div class="av ${i === 0 ? 'nuevo' : ''}">
        <div class="t">${esc(n.t || '')}</div>
        <div class="f">${n.ts ? new Date(n.ts).toLocaleString('es-MX', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : ''}</div>
      </div>`).join('')}
    </div>` : ''}

    ${piezas.length ? `<div class="card">
      <div class="sec">TU PEDIDO</div>
      ${piezas.map(p => `<div class="pz"><span class="d">${esc(p.d || 'Pieza')}</span><span class="n">×${p.n}</span></div>`).join('')}
      <div class="pz-tot"><span>Total de piezas</span><b>${ot.piezas || piezas.reduce((s, p) => s + (+p.n || 0), 0)}</b></div>
      ${ot.material ? `<div class="mat">Material: ${esc(ot.material)}</div>` : ''}
    </div>` : ''}

    <div class="card">
      <div class="sec">EL VIAJE DE TU PEDIDO</div>
      <div class="pasos">
        ${VIS.map((p, i) => `<div class="paso ${i < idxViaje ? 'on' : ''} ${i === idxViaje ? 'on now' : ''}">
          <span class="pin">${i < idxViaje ? '✓' : ''}</span><span class="pl">${p.label}</span>
          ${i <= idxViaje && fechaEtapa[p.key] ? `<span class="pf">${fmtDH(fechaEtapa[p.key])}</span>` : ''}
        </div>`).join('')}
      </div>
    </div>
  `;
  $live.innerHTML = `<span class="dot">●</span> EN VIVO · actualizado ${new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })} · se refresca solo`;
}

async function cargar(primera) {
  if (!demo && (!token || typeof RASTREO_CFG === 'undefined' || !RASTREO_CFG.url)) {
    return err('Esta orden no está disponible', 'El enlace no es válido o el seguimiento no está configurado. Contacta a Lattice Works.');
  }
  let data = null;
  try { data = await traer(); } catch (e) { data = null; }
  if (!data || !data.ot) {
    if (primera) err('Esta orden no está disponible', 'El enlace de seguimiento no existe o fue desactivado. Contacta a tu proveedor para más información.');
    return; // en refrescos silenciosos no borramos lo que ya se ve
  }
  pintar(data);
}

cargar(true);
setInterval(() => cargar(false), 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) cargar(false); });
</script>
</body>
</html>
